<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おみくじ遊び</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Noto+Sans+JP:wght@100..900&family=Playwrite+DK+Uloopet:wght@100..400&family=Yuji+Syuku&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="topContainer flexColumn">
    <div id="topPage" class="d-block omikujiBox">
      <h1 class="topTitle">おみくじ遊び</h1>
      <img src="assets/images/omikuji.PNG" alt="おみくじのイラスト">
      <button id="drawButton" class="omikujiButton">おみくじを引く</button>
    </div>
    <!-- おみくじ表示 -->
    <div id="fortuneResult" class="d-none omikujiPaper">
      <h2>おみくじ</h2>
      <hr>
      <div>
        <img id="resultImg" src="" alt="">
        <h1 id="fortune"></h1>
      </div>
      <hr>
      <div>
        <p id="fortuneComment"></p>
      </div>
      <hr>
      <div>
        <h4>✿ ラッキーカラー ✿</h4>
        <p id="luckyColor">
          // 
        </p>
      </div>
      <hr>
      <div>
        <h4>✿ ラッキードリンク ✿</h4>
        <p id="luckyDrink">
          // 
        </p>
      </div>
      <hr>
      <div>
        <h4>✿ ラッキーアクション ✿</h4>
        <p id="luckyAction">
          // 
        </p>
      </div>
      <button id="reTryButton" class="omikujiButton">もう一度おみくじを引く</button>
    </div>
    <footer>
      <div>
        <a href="about.html">このおみくじについて</a>
        <span>｜</span>
        <a href="developers.html">開発者一覧</a>
      </div>
      <p>© おみくじ</p>
    </footer>
  </div>
  <script src="assets/js/main.js"></script>
</body>
</html>
